<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase 上传测试</title>
  <style>
    body{font-family:Arial,sans-serif;background:#201814;color:#f4eadf;padding:24px}
    .box{max-width:760px;margin:0 auto;padding:24px;border:1px solid #6b523f;border-radius:16px;background:#3b2b22}
    input,button{font-size:16px;margin-top:12px}
    pre{white-space:pre-wrap;background:#16110e;padding:16px;border-radius:12px;border:1px solid #5a4434}
  </style>
</head>
<body>
  <div class="box">
    <h1>Supabase 上传测试</h1>
    <input id="file" type="file" accept="image/*" />
    <br />
    <button id="upload">测试上传</button>
    <pre id="log">等待测试...</pre>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wbzlnqvwabjgkrtvcebw.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JpG6OjJnBG4m5CnYRdQmUQ_Sm8WRP7Q';
    const STORAGE_BUCKET = 'home-photos';
    const log = document.getElementById('log');
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function write(value){
      log.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }

    document.getElementById('upload').addEventListener('click', async () => {
      const file = document.getElementById('file').files[0];
      if(!file){ write('先选一张图片'); return; }
      write({ step:'selected', name:file.name, type:file.type, size:file.size, bucket:STORAGE_BUCKET });
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `photos/${Date.now()}-${crypto.randomUUID()}.${ext}`;
      try{
        const result = await client.storage.from(STORAGE_BUCKET).upload(path, file, {
          upsert:false,
          contentType:file.type || 'image/jpeg',
          cacheControl:'3600'
        });
        if(result.error){ write({ step:'upload_error', error: result.error }); return; }
        const pub = client.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        write({ step:'success', data: result.data, publicUrl: pub.data.publicUrl });
      }catch(error){
        write({ step:'catch_error', message: error?.message, error });
      }
    });
  </script>
</body>
</html>
